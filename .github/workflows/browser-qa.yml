name: Browser QA — demand loading and workspace navigation

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright*.ts"
      - "package*.json"
      - ".github/workflows/browser-qa.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-qa:
    name: Chromium desktop / tablet / mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Arlovi
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify registration, types and production bundle
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run real-browser QA across three viewports
        run: npx playwright test --config=playwright.qa.config.ts
        env:
          CI: "true"
      - name: Publish test artifacts for failures and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arlovi-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
