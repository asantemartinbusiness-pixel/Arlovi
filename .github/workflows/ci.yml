name: ci

# Avoid duplicate feature-branch workflows and cancel stale reviews when a
# newer commit supersedes them. The full suite still runs on PRs and main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
      - run: npx playwright install --with-deps chromium
      # The e2e command already discovers accessibility specs and runs them.
      - run: npm run test:e2e
